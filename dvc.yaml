stages:
  create_sample_data:
    cmd: python scripts/create_sample_data.py
    deps:
      - scripts/create_sample_data.py
    outs:
      - data/raw/greenhouse_data.csv

  make_features:
    cmd: python -m ml.prediction.features.feature_engineering
    deps:
      - data/raw/greenhouse_data.csv
      - ml/prediction/features/feature_engineering.py
      - ml/prediction/features/gdd_calculator.py
      - ml/prediction/features/weather_provider.py
      - ml/prediction/features/openweathermap_client.py
      - config/params.yaml
      - config/schema.yaml
    outs:
      - data/processed/greenhouse_features.csv
    metrics:
      - reports/feature_report.json:
          cache: false
    params:
      - config/params.yaml:
          - feature_engineering.tomato_base_temperature_C
          - feature_engineering.planned_cycle_days
          - feature_engineering.weather_provider
          - feature_engineering.use_mock_weather_when_missing
          - weather
          - openweathermap

  train:
    cmd: python -m ml.prediction.training.train_model
    deps:
      - data/processed/greenhouse_features.csv
      - ml/prediction/training/train_model.py
      - config/params.yaml
    outs:
      - models/random_forest_yield_model.joblib
    metrics:
      - reports/metrics.json:
          cache: false
    params:
      - config/params.yaml:
          - training
          - mlflow.experiment_name
          - mlflow.run_name

  train_harvest:
    cmd: python -m ml.prediction.training.train_harvest_model
    deps:
      - data/processed/greenhouse_features.csv
      - ml/prediction/training/train_harvest_model.py
      - ml/prediction/training/maturity_common.py
      - config/params.yaml
    outs:
      - models/xgboost_harvest_date_model.joblib
    metrics:
      - reports/harvest_metrics.json:
          cache: false
    params:
      - config/params.yaml:
          - harvest_training
          - maturity_split
          - mlflow.experiment_name

  make_sequences:
    cmd: python -m ml.prediction.features.timeseries_builder
    deps:
      - data/processed/greenhouse_features.csv
      - ml/prediction/features/timeseries_builder.py
      - ml/prediction/features/gdd_calculator.py
      - ml/prediction/features/weather_provider.py
      - config/params.yaml
    outs:
      - data/processed/maturity_sequences.npz
    params:
      - config/params.yaml:
          - lstm_training.lookback
          - lstm_training.target_column
          - feature_engineering.tomato_base_temperature_C

  train_lstm:
    cmd: python -m ml.prediction.training.train_lstm_maturity
    deps:
      - data/processed/maturity_sequences.npz
      - data/processed/greenhouse_features.csv
      - ml/prediction/training/train_lstm_maturity.py
      - ml/prediction/training/maturity_common.py
      - ml/prediction/features/timeseries_builder.py
      - config/params.yaml
    outs:
      - models/lstm_maturity_model.keras
      - models/lstm_maturity_scaler.joblib
    metrics:
      - reports/lstm_metrics.json:
          cache: false
    params:
      - config/params.yaml:
          - lstm_training
          - maturity_split
          - mlflow.experiment_name

  train_ensemble:
    cmd: python -m ml.prediction.training.train_ensemble
    deps:
      - data/processed/greenhouse_features.csv
      - models/xgboost_harvest_date_model.joblib
      - models/lstm_maturity_model.keras
      - models/lstm_maturity_scaler.joblib
      - ml/prediction/training/train_ensemble.py
      - ml/prediction/training/train_harvest_model.py
      - ml/prediction/training/train_lstm_maturity.py
      - ml/prediction/training/maturity_common.py
      - ml/prediction/features/timeseries_builder.py
      - ml/prediction/calibration/calibrate_maturity.py
      - config/params.yaml
    outs:
      - models/maturity_ensemble.joblib
    metrics:
      - reports/ensemble_metrics.json:
          cache: false
    params:
      - config/params.yaml:
          - ensemble
          - harvest_training
          - lstm_training
          - maturity_split
          - mlflow.experiment_name

  predict_harvest:
    cmd: python -m ml.prediction.inference.predict_harvest_date
    deps:
      - data/processed/greenhouse_features.csv
      - models/xgboost_harvest_date_model.joblib
      - ml/prediction/inference/predict_harvest_date.py
      - ml/prediction/training/maturity_common.py
      - ml/prediction/features/feature_engineering.py
      - config/params.yaml
    outs:
      - reports/harvest_predictions.csv

  predict_harvest_ensemble:
    cmd: python -m ml.prediction.inference.predict_harvest_ensemble
    deps:
      - data/processed/greenhouse_features.csv
      - models/maturity_ensemble.joblib
      - models/xgboost_harvest_date_model.joblib
      - models/lstm_maturity_model.keras
      - models/lstm_maturity_scaler.joblib
      - ml/prediction/inference/predict_harvest_ensemble.py
      - ml/prediction/training/train_ensemble.py
      - ml/prediction/training/train_lstm_maturity.py
      - ml/prediction/training/maturity_common.py
      - ml/prediction/features/timeseries_builder.py
      - ml/prediction/features/feature_engineering.py
      - ml/prediction/calibration/calibrate_maturity.py
      - config/params.yaml
    outs:
      - reports/ensemble_harvest_predictions.csv
