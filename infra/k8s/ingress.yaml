apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salkim-ingress
  namespace: salkim
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" # Görüntü upload'ları için
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # Otomatik SSL/TLS sertifikası
    nginx.ingress.kubernetes.io/limit-rps: "10" # Rate limiting: 10 request per second per IP
spec:
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: salkim-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.salkim.app
      secretName: salkim-api-tls
